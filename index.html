<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otis Sloan Wood — Architect &amp; researcher</title>
  <meta name="description" content="Architect and researcher working on architecture, public health and co-creation.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23a8492a'/%3E%3Cpath d='M6 20 L16 10 L26 20 M9 18 V25 H23 V18' fill='none' stroke='%23f2eee6' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Friendly error message if there's a typo in content.js -->
  <script>
    window.addEventListener('error', function (e) {
      if (e.filename && e.filename.indexOf('content.js') !== -1) {
        window.__contentError = 'Line ' + e.lineno + ': ' + e.message;
      }
    });
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#top" data-bind="name"></a>
    <nav class="nav" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#publications">Publications</a>
      <a href="#talks">Talks</a>
      <a href="#teaching">Teaching</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <p class="eyebrow mono"><span data-bind="role"></span> · <span data-bind="location"></span></p>
      <h1 class="hero-name"><span data-bind="name"></span> <span class="suffix">PhD</span></h1><p class="hero-tagline" data-bind="tagline"></p>
      <dl class="now" id="now"></dl>
      <figure class="hero-figure" id="hero-figure"></figure>
    </section>

    <section class="section" id="about">
      <header class="section-head"><span class="mono">01</span><h2>About</h2></header>
      <div class="section-body about">
        <div class="about-text" id="about-text"></div>
        <figure class="portrait" id="portrait"></figure>
      </div>
    </section>

    <section class="section" id="projects">
      <header class="section-head"><span class="mono">02</span><h2>Projects</h2></header>
      <div class="section-body"><div class="projects" id="project-list"></div></div>
    </section>

    <section class="section" id="publications">
      <header class="section-head"><span class="mono">03</span><h2>Publications</h2></header>
      <div class="section-body">
        <div class="filters" id="pub-filters" role="group" aria-label="Filter publications"></div>
        <ol class="rows" id="pub-list"></ol>
        <button class="more mono" id="pub-more" hidden></button>
      </div>
    </section>

    <section class="section" id="talks">
      <header class="section-head"><span class="mono">04</span><h2>Talks &amp; media</h2></header>
      <div class="section-body"><ol class="rows" id="talk-list"></ol></div>
    </section>

    <section class="section" id="teaching">
      <header class="section-head"><span class="mono">05</span><h2>Teaching &amp; awards</h2></header>
      <div class="section-body two-col">
        <div><h3 class="sub mono">Teaching</h3><ul class="simple" id="teach-list"></ul></div>
        <div><h3 class="sub mono">Awards &amp; roles</h3><ul class="simple" id="award-list"></ul></div>
      </div>
    </section>

    <section class="section contact" id="contact">
      <header class="section-head"><span class="mono">06</span><h2>Contact</h2></header>
      <div class="section-body">
        <a class="email" id="email"></a>
        <ul class="links mono" id="links"></ul>
      </div>
    </section>
  </main>

  <footer class="footer mono">
    <span>© <span id="year"></span> <span data-bind="name"></span></span>
    <span>Updated <span data-bind="updated"></span></span>
  </footer>

  <script src="content.js"></script>
  <script src="site.js"></script>
</body>
</html>
