name: Update publications

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch publications from the research portal
        run: node scripts/fetch-publications.mjs
      - name: Save changes (only if something changed)
        id: commit
        run: |
          git config user.name "publications-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.js
          if git diff --cached --quiet -I '^// Last updated' -- publications.js; then
            echo "No new publications."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update publications from research portal"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the website
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
